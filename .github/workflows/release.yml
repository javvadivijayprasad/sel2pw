name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      # Delete package-lock.json before install. The lock was generated on
      # Windows and only records win32 platform binaries (rollup-win32-x64-*),
      # so on the Linux runner npm respects the lock and skips installing
      # the Linux-specific @rollup/rollup-linux-x64-gnu — then vitest
      # (which uses rollup internally) crashes with MODULE_NOT_FOUND.
      # npm's own error message recommends `rm package-lock.json && npm i`.
      # Trade-off: release pipeline loses lockfile-strict resolution. The
      # matrix `ci.yml` workflow keeps `npm ci` because it tests across
      # Win/macOS/Linux and any cross-platform issue would surface there.
      # See https://github.com/npm/cli/issues/4828
      - run: rm -f package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
