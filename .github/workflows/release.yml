name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      # `npm install` rather than `npm ci` so that optional platform-specific
      # native binaries (rollup-linux-x64-gnu, etc.) are installed even when
      # they aren't recorded in package-lock.json. The lock was generated on
      # Windows so only win32 rollup binaries are listed; strict `npm ci`
      # would skip the Linux ones and `npm test` (vitest -> rollup) would
      # crash with MODULE_NOT_FOUND. See https://github.com/npm/cli/issues/4828
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
