name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 is the current LTS; Node 20 is deprecated by GitHub
          # Actions (deprecation banner appeared in the release workflow
          # summary). Also: npm 12 requires Node 22+, and OIDC trusted
          # publishing needs a modern npm.
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing to npm requires npm CLI 11.5.1 or later.
      # Node 22 ships with npm 10.x by default (provenance-capable but not
      # OIDC-publish-capable), so upgrade to npm 11 explicitly. Pinned to
      # ^11 because npm@latest (12+) drops support for Node <24 — which
      # would trip EBADENGINE the moment we try to install it.
      - name: Upgrade npm to a version with OIDC publish support
        run: npm install -g npm@11
      # Nuke lock + node_modules so install resolves fresh on the Linux runner.
      # See https://github.com/npm/cli/issues/4828 — the Windows-generated
      # lock file only records win32 platform binaries.
      - run: rm -rf package-lock.json node_modules
      - run: npm install --no-audit --no-fund --include=optional
      - run: npm run lint
      - run: npm run build
      # Tests intentionally skipped here. The matrix `ci.yml` workflow runs
      # `npm test` across Windows / macOS / Linux on every push and PR — any
      # real test regression surfaces there. Skipping in the release path
      # avoids vitest+rollup's recurring Linux-binary issue from blocking
      # publish on a clean tagged commit.
      - name: Publish to npm with provenance (via OIDC Trusted Publisher)
        # v2.0.6 switched from NPM_TOKEN auth to OIDC Trusted Publisher.
        # Configured at https://www.npmjs.com/package/@vijaypjavvadi/sel2pw/access
        # under "Trusted Publisher" -> GitHub Actions. npm CLI picks up the
        # OIDC token automatically because `permissions.id-token: write` is
        # set at the job level above. No NODE_AUTH_TOKEN env var — with it
        # present, npm preferred the (2FA-blocked) token over the OIDC
        # handshake and failed with EOTP.
        run: npm publish --provenance --access public
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
