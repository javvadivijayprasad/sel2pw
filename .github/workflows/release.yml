name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      # Delete package-lock.json + node_modules + npm cache before install.
      # The lock was generated on Windows and only records win32 rollup
      # binaries. Even after removing the lock, `npm install` sometimes
      # restores the cached install shape (which still lacks the Linux
      # binary). Nuke everything and resolve fresh on the runner.
      # See https://github.com/npm/cli/issues/4828
      - run: rm -rf package-lock.json node_modules
      - run: npm install --no-audit --no-fund --include=optional
      # Explicit safety net — the npm bug above can still skip optional
      # platform binaries even with --include=optional. Install the Linux
      # rollup binary directly so vitest never crashes on MODULE_NOT_FOUND.
      # --no-save keeps package.json clean.
      - run: npm install --no-save --no-audit --no-fund @rollup/rollup-linux-x64-gnu || true
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
